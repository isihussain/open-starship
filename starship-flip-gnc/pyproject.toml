[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "starship-flip-gnc"
version = "0.1.0"
description = "Starship belly-flop to vertical landing trajectory optimizer and GNC solver."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Open Starship Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
starship-flip = "starship_flip_gnc.cli:main"
