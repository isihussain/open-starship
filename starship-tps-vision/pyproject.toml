[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "starship-tps-vision"
version = "0.1.0"
description = "Thermal Protection System (TPS) tile inspection and damage prioritization pipeline for Starship."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Open Starship Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
    "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
starship-tps = "starship_tps_vision.cli:main"
