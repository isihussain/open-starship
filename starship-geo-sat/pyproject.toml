[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "starship-geo-sat"
version = "0.1.0"
description = "Geostationary satellite operations, electric orbit raising, and payload safety module."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Open Starship Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
